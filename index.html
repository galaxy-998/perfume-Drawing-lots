<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>香水抽籤</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>香水抽籤</h1>
    <p class="subtitle">按下按鈕，開啟屬於你的香氣</p>

    <!-- 禮盒：盒蓋會掀開，名字卡片會升起 -->
    <div class="stage">
      <div class="glow"></div>
      <div class="card" id="card">
        <span id="result">?</span>
      </div>
      <div class="box">
        <div class="lid"></div>
        <div class="body"></div>
        <div class="ribbon"></div>
      </div>
    </div>

    <button id="drawBtn">開啟禮盒</button>
  </main>

  <script src="script.js"></script>
</body>
</html>
